<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    background: #2E1D16;
    margin: 0;
    padding: 60px;
    font-family: system-ui, sans-serif;
    color: #FDF9F3;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cluster {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-top: 40px;
  }
  .muffin-wrapper {
    position: relative;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .muffin-wrapper:hover {
    transform: scale(1.08) !important;
    z-index: 40 !important;
  }
  .outline-back {
    position: absolute;
    inset: -6px;
    background: #F3E3D3;
    clip-path: url(#muffin-mask);
    -webkit-clip-path: url(#muffin-mask);
    opacity: 0.9;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
  }
  .muffin-content {
    position: relative;
    width: 100%;
    height: 100%;
    clip-path: url(#muffin-mask);
    -webkit-clip-path: url(#muffin-mask);
  }
  .muffin-content img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <h2>Muffin Trio Cluster SVG Silhouette Test</h2>

  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <clipPath id="muffin-mask" clipPathUnits="objectBoundingBox">
        <path d="M 0.2600 0.9375 C 0.2600 0.9667, 0.3250 0.9792, 0.5000 0.9792 C 0.6750 0.9792, 0.7400 0.9667, 0.7400 0.9375 L 0.8100 0.5625 C 0.8600 0.5625, 0.9400 0.5250, 0.9600 0.4500 C 0.9800 0.3667, 0.9100 0.2750, 0.8400 0.2250 C 0.8000 0.1333, 0.7000 0.0750, 0.6100 0.0750 C 0.5600 0.0500, 0.5000 0.0500, 0.5000 0.0500 C 0.5000 0.0500, 0.4400 0.0500, 0.3900 0.0750 C 0.3000 0.0750, 0.2000 0.1333, 0.1600 0.2250 C 0.0900 0.2750, 0.0200 0.3667, 0.0400 0.4500 C 0.0600 0.5250, 0.1400 0.5625, 0.1900 0.5625 Z" />
      </clipPath>
    </defs>
  </svg>

  <div class="cluster" style="gap: -24px;">
    <!-- Left: Sourdough Bread -->
    <div class="muffin-wrapper" style="width: 190px; height: 230px; margin-right: -35px; transform: rotate(-4deg); z-index: 10;">
      <div class="outline-back"></div>
      <div class="muffin-content">
        <img src="file:///c:/KGFBakeHouse/src/assets/prod_multigrain_bread.jpg" />
      </div>
    </div>

    <!-- Center: Chocolate Cake (Bigger, Front) -->
    <div class="muffin-wrapper" style="width: 240px; height: 290px; transform: scale(1.04); z-index: 20;">
      <div class="outline-back" style="background: #C4733A; inset: -7px;"></div>
      <div class="muffin-content">
        <img src="file:///c:/KGFBakeHouse/src/assets/custom_cake_2.jpg" />
      </div>
    </div>

    <!-- Right: Cupcake / Muffin -->
    <div class="muffin-wrapper" style="width: 190px; height: 230px; margin-left: -35px; transform: rotate(4deg); z-index: 10;">
      <div class="outline-back"></div>
      <div class="muffin-content">
        <img src="file:///c:/KGFBakeHouse/src/assets/prod_cupcake.jpg" />
      </div>
    </div>
  </div>
</body>
</html>
