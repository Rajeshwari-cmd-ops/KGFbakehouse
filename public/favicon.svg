    <path d="M 53.5 31 C 52 29.5 52 27.5 53.5 26.5 C 54.5 27.5 55.5 29.5 53.5 31 Z" fill="#26160F" stroke="none" />
    <path d="M 55 32 C 56.5 31 57.5 30 57.5 28 C 56.5 28 55.5 30 55 32 Z" fill="#26160F" stroke="none" />
    <path d="M 57 27.5 C 56 26.5 56 25 57 24 C 57.8 24.8 58.5 26.5 57 27.5 Z" fill="#26160F" stroke="none" />
